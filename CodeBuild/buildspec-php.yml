version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-northeast-1"
    ACCOUNT_ID: "321305250643"
    ECR_REPO_PHP: "ecr-php-nitta-0922"
    ECR_REPO_PHP_Apache: "ecr-php-apache-nitta-0922"
    CONTAINER_NAME: "php"
    TASK_FAMILY: "task-php-nitta-0922"
    CONTAINER_PORT: "80"
    TASK_ROLE: "TaskExecutionRole-nitta-0922"
    RDS_ENDPOINT: "db-nitta-0922.crus22qum4dz.ap-northeast-1.rds.amazonaws.com"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Install Docker Compose plugin..."
      - |
        set -e
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -fsSL "https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
        docker compose version

  pre_build:
    commands:
      - echo "Login to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Start Docker Compose services and run Playwright test..."
      - |
        set -eu
        PROJECT_DIR="$PWD"
        cleanup() {
          status=$?
          if [ "$status" -ne 0 ]; then
            docker compose --project-directory "$PROJECT_DIR" ps || true
            docker compose --project-directory "$PROJECT_DIR" logs --no-color || true
          fi
          docker compose --project-directory "$PROJECT_DIR" down --volumes || true
          exit "$status"
        }
        trap cleanup EXIT
        echo "Starting Compose services..."
        docker compose --project-directory "$PROJECT_DIR" up -d --build db php phpmyadmin

        echo "Waiting for MySQL..."
        for attempt in $(seq 1 30); do
          if docker compose --project-directory "$PROJECT_DIR" exec -T db mysqladmin ping -uroot -prootpassword --silent; then
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo "MySQL did not become ready."
            exit 1
          fi
          sleep 2
        done

        echo "Initializing sampledb.users..."
        docker compose --project-directory "$PROJECT_DIR" exec -T db mysql -uroot -prootpassword sampledb < "$PROJECT_DIR/db/init/001-users.sql"

        echo "Run Playwright test inside the Compose network..."
        set +e
        PLAYWRIGHT_LOG="$PROJECT_DIR/playwright-codebuild.log"
        rm -f "$PLAYWRIGHT_LOG"
        docker compose --project-directory "$PROJECT_DIR" run --rm --no-deps playwright > "$PLAYWRIGHT_LOG" 2>&1
        playwright_status=$?
        cat "$PLAYWRIGHT_LOG"
        set -e
        if [ "$playwright_status" -ne 0 ]; then
          echo "[Playwright error report] docker compose run failed with exit code $playwright_status"
          echo "[Playwright error report] Captured output:"
          sed -n '1,400p' "$PLAYWRIGHT_LOG" || true
          echo "[Playwright error report] Compose status:"
          docker compose --project-directory "$PROJECT_DIR" ps -a || true
          exit "$playwright_status"
        fi

      - echo Build Docker image for php...
      - docker build --build-arg ACCOUNT_ID=$ACCOUNT_ID --build-arg REGION=$AWS_DEFAULT_REGION --build-arg ECR_REPO_PHP_Apache=$ECR_REPO_PHP_Apache -t $ECR_REPO_PHP:latest ./app
      - docker tag $ECR_REPO_PHP:latest $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_PHP:latest

  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Build or Playwright test failed; skip ECR push and deployment artifacts."
          exit 1
        fi
      - echo "Push Docker image to ECR..."
      - docker push $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_PHP:latest

      - echo "Generate taskdef-php.json..."
      - |
        cat <<EOF > taskdef-php.json
        {
          "family": "${TASK_FAMILY}",
          "networkMode": "awsvpc",
          "requiresCompatibilities": ["FARGATE"],
          "cpu": "512",
          "memory": "1024",
          "executionRoleArn": "arn:aws:iam::${ACCOUNT_ID}:role/${TASK_ROLE}",
          "containerDefinitions": [
            {
              "name": "${CONTAINER_NAME}",
              "image": "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO_PHP}:latest",
              "portMappings": [
                {
                  "containerPort": ${CONTAINER_PORT},
                  "protocol": "tcp"
                }
              ],
              "essential": true,
              "environment": [
                { "name": "DB_HOST", "value": "${RDS_ENDPOINT}" },
                { "name": "DB_USER", "value": "root" },
                { "name": "DB_PASS", "value": "root1234" },
                { "name": "DB_NAME", "value": "sampledb" }
              ]
            }
          ]
        }
        EOF
      - echo "Copy appspec.yml.."
      - ls -l CodeDeploy/
      - pwd
      - cp CodeDeploy/appspec.yml ./ # appspecファイルをビルド成果物に含める
      - echo "Generated files:"
      - ls -l

artifacts:
  files:
    - taskdef-php.json
    - appspec.yml
