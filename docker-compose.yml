services:

  db:
    image: mysql:8.0
    container_name: seminar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sampledb
      MYSQL_USER: app
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: seminar-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"

  php:
    build:
      context: ./app
      dockerfile: Dockerfile.compose
    container_name: seminar-php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: sampledb
      DB_USER: app
      DB_PASS: apppassword
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www/html

  playwright:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    depends_on:
      php:
        condition: service_started
    volumes:
      - ./CodeBuild:/tests:ro
    command:
      - sh
      - -c
      - >-
        cd /tmp && cp /tests/playwright-test.ts /tmp/playwright-test.ts &&
        npm init -y >/dev/null 2>&1 &&
        npm install --no-save playwright@1.55.0 tsx@4.20.3 typescript@5.9.2 @types/node@24.5.2 >/dev/null 2>&1 &&
        /tmp/node_modules/.bin/tsc --noEmit --module nodenext --moduleResolution nodenext --target ES2022 --skipLibCheck /tmp/playwright-test.ts &&
        NODE_PATH=/tmp/node_modules /tmp/node_modules/.bin/tsx /tests/playwright-test.ts

volumes:
  mysql-data:
